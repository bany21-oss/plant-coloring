<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f1">
  <title>초록 관찰실 — 식물 색칠하기</title>
  <style>
    :root{--ink:#263b32;--muted:#718077;--green:#52765b;--pale:#edf2e8;--line:#e5e9df;--paper:#fffefa;--shadow:0 12px 34px #344b3510}
    *{box-sizing:border-box} body{margin:0;background:#f7f8f3;color:var(--ink);font-family:ui-rounded,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;min-height:100vh}
    button{font:inherit;color:inherit;cursor:pointer} .app{max-width:1440px;margin:auto;padding:22px 32px 30px}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:21px}
    .brand{display:flex;align-items:center;gap:12px}.brand-mark{height:42px;width:42px;border-radius:15px;background:#e3eddd;display:grid;place-items:center;font-size:22px}.brand h1{font-size:19px;margin:0 0 2px;letter-spacing:-.04em}.brand p{font-size:12px;color:var(--muted);margin:0}
    .top-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:white;padding:10px 15px;border-radius:12px;font-size:13px;font-weight:650;transition:.16s}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.soft{background:#f1f5ed;border-color:#e4ebdf}
    .layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}.panel,.work{background:var(--paper);border:1px solid #ebeee6;border-radius:20px;box-shadow:var(--shadow)}
    .panel{padding:20px 18px;display:flex;flex-direction:column;gap:19px}.section-title{font-size:13px;font-weight:750;margin:0 0 11px;display:flex;justify-content:space-between;align-items:center}.section-title small{font-size:11px;color:#89948c;font-weight:500}
    .plants{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-height:230px;overflow-y:auto;padding:2px 3px 2px 0;align-content:start;scrollbar-width:thin}.plant-option{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 4px 8px;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:11px;color:#65736a}.plant-option .emoji{font-size:22px}.plant-option.active{border-color:#88a58b;background:#f1f6ed;color:#35583c;box-shadow:inset 0 0 0 1px #88a58b}
    .divider{height:1px;background:#edf0e9;margin:-4px 0}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tool{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:#66756b}.tool .tool-icon{font-size:22px;line-height:1}.tool.active{border-color:#86a487;background:#eef4e9;color:#365b3c;box-shadow:inset 0 0 0 1px #86a487}
    .colors{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.swatch{width:28px;height:28px;padding:0;border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px #dce2d8;position:relative}.swatch.selected{box-shadow:0 0 0 2px #58735c}.swatch.selected:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:13px;text-shadow:0 1px 3px #333}.custom-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:#6d7b71;font-size:12px}.custom-color{width:35px;height:28px;padding:1px;border:1px solid var(--line);border-radius:8px;background:white}
    .size-head{display:flex;justify-content:space-between;font-size:12px;color:#65736a;margin-bottom:10px}.size-head b{color:#405948}.range{width:100%;accent-color:#638167}.size-preview{display:flex;align-items:center;gap:9px;color:#8a958b;font-size:10px;margin-top:6px}.preview-dot{width:19px;height:19px;background:#59775d;border-radius:50%;display:grid;place-items:center}.preview-dot i{display:block;border-radius:50%;background:#fff;width:5px;height:5px}
    .side-note{padding:11px 12px;background:#f6f8f3;border-radius:12px;color:#76837a;font-size:11px;line-height:1.6}.side-note strong{color:#4e6a53}
    .work{padding:18px 20px 14px}.work-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.work-title h2{font-size:16px;margin:0 0 4px;letter-spacing:-.03em}.work-title p{font-size:11px;color:#849087;margin:0}.canvas-actions{display:flex;gap:7px}.icon-btn{height:36px;min-width:38px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:13px}.icon-btn:hover:not(:disabled){background:#f4f7f0}.icon-btn:disabled{opacity:.38;cursor:default}
    .canvas-wrap{position:relative;width:100%;aspect-ratio:1.315;background:#fbfaf5;border:1px solid #eceee5;border-radius:16px;overflow:hidden;touch-action:none}.template-svg,.ink-canvas{position:absolute;inset:0;width:100%;height:100%}.template-svg{opacity:.48;pointer-events:none}.ink-canvas{cursor:crosshair;touch-action:none}.canvas-wrap:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px #ffffff80}
    .canvas-caption{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:11px;color:#879188}.canvas-caption strong{color:#607763;font-weight:600}.keyboard-hint{color:#a0a9a1}
    @media(max-width:800px){.app{padding:16px}.layout{grid-template-columns:1fr;gap:14px}.panel{display:grid;grid-template-columns:1fr 1fr;gap:17px}.panel .section:nth-child(3),.panel .section:nth-child(4){grid-column:span 1}.side-note{grid-column:span 2}.work{padding:14px}.canvas-wrap{aspect-ratio:1.05}}
    @media(max-width:510px){.app{padding:12px}.brand p{display:none}.top-actions .btn{padding:9px 10px;font-size:12px}.layout{gap:11px}.panel{padding:14px 12px;gap:14px}.canvas-wrap{aspect-ratio:.88}.canvas-caption .keyboard-hint{display:none}.work-head{align-items:flex-start}.canvas-actions{gap:4px}.icon-btn{min-width:34px;padding:0 7px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="brand-mark">🌱</div><div><h1>초록 관찰실</h1><p>식물을 살펴보고, 나만의 색으로 채워봐요</p></div></div>
    <div class="top-actions"><button class="btn soft" id="resetBtn">다시 시작</button><button class="btn primary" id="saveBtn">그림 저장 ↓</button></div>
  </header>
  <main class="layout">
    <aside class="panel" aria-label="그림 도구">
      <section class="section"><h3 class="section-title">오늘의 식물 <small>11가지 밑그림</small></h3><div class="plants" id="plants"></div></section>
      <div class="divider"></div>
      <section class="section"><h3 class="section-title">그리기 도구 <small>도구를 골라보세요</small></h3><div class="tools" id="tools"></div></section>
      <section class="section"><h3 class="section-title">색상 팔레트 <small>마음껏 섞어봐요</small></h3><div class="colors" id="colors"></div><div class="custom-row"><span>새로운 색 고르기</span><input class="custom-color" type="color" id="customColor" value="#e87958" aria-label="사용자 지정 색상"></div></section>
      <section class="section"><div class="size-head"><span>붓 굵기</span><b id="sizeValue">중간</b></div><input class="range" id="sizeRange" type="range" min="5" max="44" value="20" aria-label="붓 굵기"><div class="size-preview"><span>가늘게</span><span class="preview-dot"><i id="previewDot"></i></span><span>굵게</span></div></section>
      <div class="side-note"><strong>관찰해 보세요!</strong><br>잎의 모양과 줄기의 방향을 살펴보고, 실제 식물과 다른 나만의 색으로 표현해도 좋아요.</div>
    </aside>
    <section class="work" aria-label="색칠 작업 공간">
      <div class="work-head"><div class="work-title"><h2 id="plantTitle">튤립</h2><p>연한 밑그림 위에 자유롭게 색칠해요</p></div><div class="canvas-actions"><button class="icon-btn" id="undoBtn" title="실행 취소" aria-label="실행 취소" disabled>↶</button><button class="icon-btn" id="redoBtn" title="다시 실행" aria-label="다시 실행" disabled>↷</button></div></div>
      <div class="canvas-wrap" id="canvasWrap"><svg class="template-svg" id="templateSvg" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg><canvas class="ink-canvas" id="drawCanvas" aria-label="식물 밑그림에 색칠하기"></canvas></div>
      <div class="canvas-caption"><span><strong id="toolHint">사인펜</strong>을 골라 식물에 색을 입혀보세요</span><span class="keyboard-hint">실행 취소: Ctrl/⌘ + Z</span></div>
    </section>
  </main>
</div>

    {id:'daisy',name:'데이지',emoji:'🌼',svg:`<g stroke="#72866f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M500 625 C500 526 500 433 500 338" fill="none"/><path d="M499 500 C448 442 397 438 359 455 C395 488 445 511 499 500Z" fill="#f4f4e9"/><path d="M501 452 C546 408 601 407 641 426 C612 462 557 474 501 452Z" fill="#f4f4e9"/><g fill="#f7f4e9"><ellipse cx="500" cy="273" rx="22" ry="61"/><ellipse cx="500" cy="273" rx="22" ry="61" transform="rotate(45 500 320)"/><ellipse cx="500" cy="273" rx="22" ry="61" transform="rotate(90 500 320)"/><ellipse cx="500" cy="273" rx="22" ry="61" transform="rotate(135 500 320)"/><ellipse cx="500" cy="273" rx="22" ry="61" transform="rotate(180 500 320)"/><ellipse cx="500" cy="273" rx="22" ry="61" transform="rotate(225 500 320)"/><ellipse cx="500" cy="273" rx="22" ry="61" transform="rotate(270 500 320)"/><ellipse cx="500" cy="273" rx="22" ry="61" transform="rotate(315 500 320)"/></g><circle cx="500" cy="320" r="53" fill="#f7f4e9"/><path d="M443 650 Q500 635 558 650" fill="none"/></g>`},
    {id:'lavender',name:'라벤더',emoji:'🪻',svg:`<g stroke="#72866f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M500 625 C496 487 502 362 500 234 M445 625 C455 500 463 397 466 288 M555 625 C542 490 538 378 537 268" fill="none"/><path d="M500 476 C454 441 419 436 388 449 C420 477 457 488 500 476Z M500 531 C540 489 579 482 610 497 C582 527 542 541 500 531Z M465 428 C421 400 390 399 363 412 C394 436 428 442 465 428Z M539 466 C574 429 607 423 636 436 C611 462 577 475 539 466Z" fill="#f4f4e9"/><g fill="#f7f4e9"><ellipse cx="500" cy="232" rx="18" ry="31"/><ellipse cx="479" cy="258" rx="17" ry="28"/><ellipse cx="520" cy="262" rx="17" ry="28"/><ellipse cx="466" cy="289" rx="16" ry="26"/><ellipse cx="500" cy="291" rx="17" ry="27"/><ellipse cx="535" cy="294" rx="16" ry="26"/><ellipse cx="449" cy="321" rx="15" ry="24"/><ellipse cx="484" cy="324" rx="16" ry="24"/><ellipse cx="520" cy="327" rx="16" ry="24"/><ellipse cx="553" cy="326" rx="15" ry="24"/></g><path d="M435 650 Q500 635 565 650" fill="none"/></g>`},

    {id:'potted',name:'화분 식물',emoji:'🪴',svg:`<g stroke="#72866f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M500 492 C498 416 500 345 500 275 M500 420 C443 370 409 321 399 267 M501 390 C556 342 589 291 600 240 M500 350 C461 296 456 245 474 209" fill="none"/><path d="M500 434 C442 378 393 367 357 388 C389 431 441 452 500 434Z M500 376 C553 329 604 321 641 343 C610 384 555 401 500 376Z M399 286 C360 249 357 208 378 181 C417 201 433 241 419 276Z M600 260 C609 211 637 184 673 183 C679 222 654 257 613 273Z M474 233 C449 192 458 157 488 139 C516 168 516 206 492 235Z" fill="#f4f4e9"/><path d="M410 493 L590 493 L570 650 L430 650Z" fill="#f7f4e9"/><path d="M400 493 Q500 478 600 493" fill="none"/></g>`},

  const palette=['#e85c55','#f28d48','#f3c849','#68a86c','#49a99b','#4f8fc2','#7278c9','#a76eb3','#e77f9b','#80583e','#364b42','#ffffff'];

  let activePlant=templates[0], activeTool='marker', color=palette[0], size=20, strokes=[], undone=[], current=null, drawing=false;
  const canvas=document.getElementById('drawCanvas'), ctx=canvas.getContext('2d'), wrap=document.getElementById('canvasWrap'), svg=document.getElementById('templateSvg');
  const plantsEl=document.getElementById('plants'), toolsEl=document.getElementById('tools'), colorsEl=document.getElementById('colors');
  function renderPlants(){plantsEl.innerHTML=templates.map(p=>`<button class="plant-option ${p.id===activePlant.id?'active':''}" data-id="${p.id}" aria-pressed="${p.id===activePlant.id}"><span class="emoji">${p.emoji}</span><span>${p.name}</span></button>`).join(''); plantsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{activePlant=templates.find(p=>p.id===b.dataset.id);svg.innerHTML=activePlant.svg;document.getElementById('plantTitle').textContent=activePlant.name;strokes=[];undone=[];renderPlants();syncHistory()})}
  function renderTools(){toolsEl.innerHTML=tools.map(t=>`<button class="tool ${t.id===activeTool?'active':''}" data-id="${t.id}" aria-pressed="${t.id===activeTool}"><span class="tool-icon">${t.icon}</span><span>${t.name}</span></button>`).join('');toolsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeTool=b.dataset.id;renderTools();document.getElementById('toolHint').textContent=tools.find(t=>t.id===activeTool).name;canvas.style.cursor=activeTool==='eraser'?'cell':'crosshair'})}

  function setColor(c){color=c;document.getElementById('customColor').value=c;renderColors()}
  function resize(){const r=wrap.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);redraw()}
  function paintStroke(s){const w=canvas.clientWidth,h=canvas.clientHeight,min=Math.min(w,h),pts=s.points.map(p=>({x:p.x*w,y:p.y*h,pressure:p.pressure||.5}));if(!pts.length)return;const base=s.size*min;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';

    else if(s.tool==='marker'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.86;ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=base*.94}
    else if(s.tool==='water'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.2;ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=base*1.75;ctx.shadowColor=s.color;ctx.shadowBlur=base*.65}
    else {ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.38;ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=base*.58}
    if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke()}
    if(s.tool==='pencil'&&pts.length>1){ctx.globalAlpha=.22;ctx.lineWidth=Math.max(1,base*.12);ctx.strokeStyle=s.color;for(let k=0;k<3;k++){ctx.beginPath();pts.forEach((p,i)=>{const jx=Math.sin(i*12.989+k*77.7)*base*.13,jy=Math.cos(i*8.31+k*41.2)*base*.13;if(!i)ctx.moveTo(p.x+jx,p.y+jy);else ctx.lineTo(p.x+jx,p.y+jy)});ctx.stroke()}}
    ctx.restore();
  }
  function redraw(){if(!canvas.width)return;ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);strokes.forEach(paintStroke);if(current)paintStroke(current)}
  function coords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,pressure:e.pressure||.5}}
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;current={tool:activeTool,color,size:size/Math.min(canvas.clientWidth,canvas.clientHeight),points:[coords(e)]};redraw()});
  canvas.addEventListener('pointermove',e=>{if(!drawing||!current)return;current.points.push(coords(e));redraw()});
  function finish(){if(!drawing)return;drawing=false;if(current){strokes.push(current);current=null;undone=[];redraw();syncHistory()}}
  canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('lostpointercapture',finish);
  function syncHistory(){document.getElementById('undoBtn').disabled=!strokes.length;document.getElementById('redoBtn').disabled=!undone.length}
  function undo(){if(strokes.length){undone.push(strokes.pop());redraw();syncHistory()}}function redo(){if(undone.length){strokes.push(undone.pop());redraw();syncHistory()}}
  document.getElementById('undoBtn').onclick=undo;document.getElementById('redoBtn').onclick=redo;
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});
  document.getElementById('resetBtn').onclick=()=>{if(strokes.length&&!confirm('지금까지 칠한 그림을 모두 지우고 다시 시작할까요?'))return;strokes=[];undone=[];redraw();syncHistory()};
  document.getElementById('sizeRange').oninput=e=>{size=Number(e.target.value);document.getElementById('sizeValue').textContent=size<14?'가늘게':size>33?'굵게':'중간';document.getElementById('previewDot').style.width=Math.max(4,size*.42)+'px';document.getElementById('previewDot').style.height=Math.max(4,size*.42)+'px'};
  document.getElementById('customColor').oninput=e=>setColor(e.target.value);
  document.getElementById('saveBtn').onclick=()=>{const out=document.createElement('canvas'),scale=1.4,w=1000*scale,h=760*scale;out.width=w;out.height=h;const c=out.getContext('2d');c.fillStyle='#fbfaf5';c.fillRect(0,0,w,h);const xml=new XMLSerializer().serializeToString(svg);const img=new Image();img.onload=()=>{c.drawImage(img,0,0,w,h);c.drawImage(canvas,0,0,canvas.width,canvas.height,0,0,w,h);const a=document.createElement('a');a.download=`초록관찰실-${activePlant.name}.png`;a.href=out.toDataURL('image/png');a.click()};img.onerror=()=>alert('이미지를 저장하지 못했어요. 다시 시도해 주세요.');img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)};
  svg.innerHTML=activePlant.svg;renderPlants();renderTools();renderColors();document.getElementById('previewDot').style.width='8px';document.getElementById('previewDot').style.height='8px';new ResizeObserver(resize).observe(wrap);resize();
})();
</script>
